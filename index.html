  _topicRows(gid,code){
    const tops=groupTopics(group(gid),code);
    if(!tops.length) return `<div style="font-size:12px;color:var(--faint);padding:4px 0">No topics yet — add the first one below.</div>`;
    return tops.map((tp,i)=>`<div style="display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r2)">
      <span class="pt" style="width:7px;height:7px;background:var(--accent)"></span>
      <span style="flex:1;font-size:12.5px;font-weight:500">${esc(tp)}</span>
      <button class="btn ico sm gho" title="Remove topic" onclick="Modal.removeTopic('${gid}','${code}',${i})">${I.trash(14)}</button>
    </div>`).join('');
  },
  addTopic(gid,code){
    const el=document.getElementById('topIn'), txt=(el.value||'').trim(); if(!txt) return;
    const g=group(gid); g.topics=g.topics||{}; g.topics[code]=g.topics[code]||[];
    if(g.topics[code].some(x=>x.toLowerCase()===txt.toLowerCase())){ FX.tap('error'); el.value=''; return; }
    g.topics[code].push(txt);
    log(gid,`added topic <b>${esc(txt)}</b> under ${esc(code)}`);
    DB.save(); FX.tap('med'); el.value='';
    const list=document.getElementById('topList'); if(list) list.innerHTML=Modal._topicRows(gid,code);
  },
  removeTopic(gid,code,i){
    const g=group(gid); if(!g.topics||!g.topics[code]) return;
    const removed=g.topics[code][i]; g.topics[code].splice(i,1);
    DB.s.tasks.forEach(t=>{ if(t.groupId===gid&&t.courseCode===code&&t.topic===removed) t.topic=null; });
    log(gid,`removed topic <b>${esc(removed||'')}</b> from ${esc(code)}`);
    DB.save(); FX.tap('error');
    const list=document.getElementById('topList'); if(list) list.innerHTML=Modal._topicRows(gid,code);
  },

  /* ---- tasks ---- */
  task(id){
    if(window.event) window.event.stopPropagation();
    const t=DB.s.tasks.find(x=>x.id===id); if(!t) return;
    const m=user(t.assigneeId), g=group(t.groupId), s=stat(t.status), p=prio(t.prio);
    const can=Board.canEdit(t), lead=App.isLead&&t.groupId===App.me.groupId;
    const pc=t.status==='done'?100:t.progress;
    Modal.open(`
      <div class="mh"><h3>${esc(t.title)}</h3><button class="btn ico sm gho" onclick="Modal.close()">${I.x(15)}</button></div>
      <div class="mb">
        <div style="display:flex;gap:5px;flex-wrap:wrap">${tag(s.n,s.c)}${tag(p.n+' priority',p.c)}
          ${t.courseCode?`<span class="tag mono" style="background:var(--accent-soft);color:var(--accent)">${esc(t.courseCode)}</span>`:''}
          ${t.topic?`<span class="tag" style="background:var(--gray-s);color:var(--ink-2)">${esc(t.topic)}</span>`:''}
          <span class="tag" style="background:var(--gray-s);color:var(--muted)">${esc(g.name)}</span>
          <span class="tag" style="background:var(--gray-s);color:var(--muted)">Due ${dstr(t.due)}</span></div>

        <div style="display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--line);border-radius:var(--r2)">
          ${m?av(m,'lg'):''}
          <div style="flex:1"><div style="font-weight:600;font-size:13px">${m?esc(m.name):'Unassigned'}</div>
            <div style="font-size:11.5px;color:var(--muted)">${m?esc(m.role):''}</div></div>
          ${ring(pc,46,s.c==='gray'?'accent':s.c)}
        </div>

        <div><div class="sec" style="margin-bottom:5px">Description</div>
          <div style="font-size:12.5px;line-height:1.6;color:var(--ink-2)">${esc(t.desc)||'<span style="color:var(--faint)">No description provided.</span>'}</div></div>

        ${t.githubUrl || t.attachmentUrl ? `
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;">
          ${t.githubUrl ? `<a href="${esc(t.githubUrl)}" target="_blank" rel="noopener" class="btn sm" style="background:#24292e;color:#fff;text-decoration:none">${I.code(14)} View GitHub PR / Code</a>` : ''}
          ${t.attachmentUrl ? `<a href="${esc(t.attachmentUrl)}" target="_blank" rel="noopener" class="btn sm gho" style="text-decoration:none">${I.paperclip(14)} View Attachment Document</a>` : ''}
        </div>` : ''}

        ${can?`
        <div class="field"><label>Status</label>
          <div class="seg">${STATUSES.map(x=>`<button class="${t.status===x.id?'on':''}" onclick="Modal.setStatus('${t.id}','${x.id}')">${x.n}</button>`).join('')}</div></div>
        <div class="field"><label>Progress — <b id="pv">${t.progress}%</b></label>
          <input type="range" class="rng" min="0" max="100" step="5" value="${t.progress}"
            oninput="document.getElementById('pv').textContent=this.value+'%'"
            onchange="Modal.setProgress('${t.id}',this.value)"/></div>`
        :`<div class="banner info">${App.isFaculty?I.shield(16):I.lock(16)}<div>${App.isFaculty
            ?'Faculty accounts have read-only access to tasks. Use <b>Add remark</b> on the group page to give feedback.'
            :'Only the assignee or the Team Lead can update this task.'}</div></div>`}

        <div><div class="sec" style="margin-bottom:4px">Comments (${t.comments.length})</div>
          ${t.comments.length?t.comments.map(c=>{
            const cu=user(c.userId);
            return `<div class="cmt">${cu?av(cu,'sm'):''}
              <div><div class="hd">${cu?esc(cu.name):'—'}<span>${cu?esc(cu.role):''} · ${ago(c.ts)}</span></div>
              <div class="bd">${esc(c.text)}</div></div></div>`;
          }).join(''):`<div style="font-size:12.5px;color:var(--faint);padding:7px 0">No comments yet.</div>`}
          <div style="display:flex;gap:7px;margin-top:10px">
            <input class="inp" id="cmtIn" placeholder="Write a comment" onkeydown="if(event.key==='Enter')Modal.comment('${t.id}')"/>
            <button class="btn" onclick="Modal.comment('${t.id}')">Post</button></div></div>

        <div style="font-size:11.5px;color:var(--faint);border-top:1px solid var(--line-2);padding-top:11px">
          Created ${dstr(t.createdAt)} · updated ${ago(t.updatedAt)}</div>
      </div>
      <div class="mf">
        ${lead?`<button class="btn" onclick="Modal.taskForm('${t.id}')">${I.edit(15)} Edit</button>
                <button class="btn dan ico" title="Delete" onclick="Modal.delTask('${t.id}')">${I.trash(15)}</button>`:''}
        <div class="sp"></div><button class="btn" onclick="Modal.close()">Close</button></div>`);
  },

  setStatus(id,st){ Board.move(id,st); Modal.task(id); },
  setProgress(id,val){
    const t=DB.s.tasks.find(x=>x.id===id); if(!t||!Board.canEdit(t)) return;
    const v=+val, before=t.progress;
    t.progress=v; t.updatedAt=now();
    if(v===100&&t.status!=='done') t.status='review';
    if(v<100&&t.status==='done') t.status='progress';
    if(v>0&&t.status==='todo') t.status='progress';
    log(t.groupId,`updated <b>${esc(t.title)}</b> from ${before}% to <b>${v}%</b>`);
    DB.save(); FX.tap(v===100?'done':'med'); toast(I.check(15),`Progress set to ${v}%`);
    App.render(); Modal.task(id);
  },
  comment(id){
    const t=DB.s.tasks.find(x=>x.id===id), el=document.getElementById('cmtIn'), txt=el.value.trim();
    if(!txt){ FX.tap('error'); return; }
    t.comments.push({userId:App.me.id,text:txt,ts:now()}); t.updatedAt=now();
    log(t.groupId,`commented on <b>${esc(t.title)}</b>`);
    DB.save(); FX.tap('med'); App.render(); Modal.task(id);
  },

  _topicOpts(code,cur){
    const tops=groupTopics(group(App.me.groupId),code);
    return `<option value="">— No topic —</option>`+tops.map(tp=>`<option value="${esc(tp)}" ${cur===tp?'selected':''}>${esc(tp)}</option>`).join('');
  },
  syncTopics(){
    const sc=document.getElementById('f_subject'), tp=document.getElementById('f_topic');
    if(sc&&tp) tp.innerHTML=Modal._topicOpts(sc.value,null);
  },
  taskForm(id,status='todo',preCode,preDue){
    if(!App.isLead){ FX.tap('error'); return toast(I.lock(15),'Only the Team Lead can create or edit tasks'); }
    const t=id?DB.s.tasks.find(x=>x.id===id):null;
    const ms=membersOf(App.me.groupId);
    const due=t?t.due:(preDue||(now()+5*864e5));
    const g0=group(App.me.groupId), gsubs=groupSubjects(g0);
    const subjList=gsubs.length?SEM3.filter(s=>gsubs.includes(s.code)):SEM3.filter(s=>s.code!=='—');
    const curCode=t?t.courseCode:(preCode||gsubs[0]||(g0||{}).courseCode);
    const curTopic=t?t.topic:null;
    Modal.open(`
      <div class="mh"><h3>${t?'Edit task':'New task'}</h3><button class="btn ico sm gho" onclick="Modal.close()">${I.x(15)}</button></div>
      <div class="mb">
        <div class="field"><label>Title</label><input class="inp" id="f_title" value="${t?esc(t.title):''}" placeholder="What needs to be done?"/></div>
        <div class="field"><label>Description</label><textarea class="inp" id="f_desc" placeholder="Describe what done looks like">${t?esc(t.desc):''}</textarea></div>
        <div class="two">
          <div class="field"><label>Subject</label>
            <select class="inp" id="f_subject" onchange="Modal.syncTopics()">${subjList.map(s=>`<option value="${s.code}" ${curCode===s.code?'selected':''}>${s.code} — ${esc(s.name)}</option>`).join('')}</select></div>
          <div class="field"><label>Topic <span style="color:var(--faint);font-weight:400">(optional)</span></label>
            <select class="inp" id="f_topic">${Modal._topicOpts(curCode,curTopic)}</select></div>
        </div>
        <div class="field"><label>Assign to</label>
          <select class="inp" id="f_ass">${ms.map(m=>`<option value="${m.id}" ${t&&t.assigneeId===m.id?'selected':''}>${esc(m.name)} — ${m.role}</option>`).join('')}</select></div>
        <div class="two">
          <div class="field"><label>Priority</label><select class="inp" id="f_prio">${PRIOS.map(p=>`<option value="${p.id}" ${(t?t.prio:'med')===p.id?'selected':''}>${p.n}</option>`).join('')}</select></div>
          <div class="field"><label>Due date</label><input type="date" class="inp" id="f_due" value="${inputDate(due)}"/></div>
        </div>
        <div class="field"><label>GitHub PR / Submission Link <span style="color:var(--faint);font-weight:400">(optional)</span></label>
          <input class="inp" id="f_gh" value="${t?esc(t.githubUrl||''):''}" placeholder="https://github.com/org/repo/pull/1"/></div>
        <div class="field"><label>Document / Report Link <span style="color:var(--faint);font-weight:400">(optional)</span></label>
          <input class="inp" id="f_att" value="${t?esc(t.attachmentUrl||''):''}" placeholder="https://drive.google.com/... or PDF URL"/></div>
        <div class="field"><label>Status</label><select class="inp" id="f_status">${STATUSES.map(s=>`<option value="${s.id}" ${(t?t.status:status)===s.id?'selected':''}>${s.n}</option>`).join('')}</select></div>
        <div id="f_err"></div>
      </div>
      <div class="mf"><div class="sp"></div><button class="btn" onclick="Modal.close()">Cancel</button>
        <button class="btn pri" onclick="Modal.saveTask(${t?`'${t.id}'`:'null'})">${t?'Save changes':'Create task'}</button></div>`);
  },
  saveTask(id){
    const title=document.getElementById('f_title').value.trim();
    if(!title) return Modal.err('f_err','Give the task a title.');
    const desc=document.getElementById('f_desc').value.trim();
    const assigneeId=document.getElementById('f_ass').value;
    const prioV=document.getElementById('f_prio').value;
    const status=document.getElementById('f_status').value;
    const courseCode=document.getElementById('f_subject').value;
    const topic=(document.getElementById('f_topic')||{}).value||null;
    const dv=document.getElementById('f_due').value;
    const due=dv?new Date(dv+'T12:00:00').getTime():now();
    const githubUrl=(document.getElementById('f_gh')||{}).value.trim();
    const attachmentUrl=(document.getElementById('f_att')||{}).value.trim();
    const m=user(assigneeId);
    if(id){
      const t=DB.s.tasks.find(x=>x.id===id), re=t.assigneeId!==assigneeId;
      Object.assign(t,{title,desc,assigneeId,prio:prioV,status,due,courseCode,topic,githubUrl,attachmentUrl,updatedAt:now()});
      if(status==='done') t.progress=100;
      log(t.groupId, re?`reassigned <b>${esc(title)}</b> to <b>${esc(m.name)}</b> (${m.role})`:`updated <b>${esc(title)}</b>`);
      toast(I.check(15),'Task updated');
    }else{
      DB.s.tasks.push({id:uid(),groupId:App.me.groupId,assigneeId,title,desc,status,prio:prioV,due,courseCode,topic,githubUrl,attachmentUrl,
        progress:status==='done'?100:0,createdAt:now(),updatedAt:now(),comments:[]});
      log(App.me.groupId,`assigned <b>${esc(title)}</b> to <b>${esc(m.name)}</b> (${m.role})`);
      toast(I.check(15),`Assigned to ${m.name.split(' ')[0]}`);
    }
    DB.save(); FX.tap('done'); Modal.close(); App.render();
  },


  delTask(id){
    const t=DB.s.tasks.find(x=>x.id===id);
    Modal.open(`<div class="mh"><h3>Delete task?</h3></div>
      <div class="mb"><p style="font-size:12.5px;line-height:1.6;color:var(--ink-2)"><b>${esc(t.title)}</b> will be removed from the board for everyone.</p></div>
      <div class="mf"><div class="sp"></div><button class="btn" onclick="Modal.close()">Cancel</button>
        <button class="btn dan" onclick="Modal.doDelTask('${id}')">Delete</button></div>`);
  },
  doDelTask(id){
    const t=DB.s.tasks.find(x=>x.id===id);
    DB.s.tasks=DB.s.tasks.filter(x=>x.id!==id);
    log(t.groupId,`deleted <b>${esc(t.title)}</b>`);
    DB.save(); FX.tap('error'); Modal.close(); toast(I.trash(15),'Task deleted'); App.render();
  },

  remark(gid, targetMemberId){
    const g = group(gid); if(!g) return;
    const ms = membersOf(g.id);
    Modal.open(`<div class="mh"><h3>Faculty Review Remark &amp; Member Evaluation</h3><button class="btn ico sm gho" onclick="Modal.close()">${I.x(15)}</button></div>
      <div class="mb">
        <div class="field" style="margin-bottom:10px">
          <label>Select Team Member to Evaluate</label>
          <select class="inp" id="rk_member">
            <option value="all" ${!targetMemberId || targetMemberId==='all' ? 'selected' : ''}>Entire Group (${esc(g.name)})</option>
            ${ms.map(m => `<option value="${m.id}" ${targetMemberId===m.id ? 'selected' : ''}>${esc(m.name)} — ${esc(m.role)}</option>`).join('')}
          </select>
        </div>
        <div class="two" style="margin-bottom:10px">
          <div class="field"><label>Evaluation Grade <span style="color:var(--faint);font-weight:400">(optional)</span></label>
            <select class="inp" id="rk_grade">
              <option value="">No Grade</option>
              <option value="A+ (95-100%)">A+ (95-100%)</option>
              <option value="A (85-94%)">A (85-94%)</option>
              <option value="B+ (75-84%)">B+ (75-84%)</option>
              <option value="B (65-74%)">B (65-74%)</option>
              <option value="C (50-64%)">C (50-64%)</option>
            </select>
          </div>
          <div class="field"><label>Marks / Score <span style="color:var(--faint);font-weight:400">(e.g. 19/20)</span></label>
            <input class="inp" id="rk_score" placeholder="e.g. 19/20"/>
          </div>
        </div>
        <div class="field"><label>Faculty Review Remark &amp; Feedback</label>
          <textarea class="inp" id="rk_txt" placeholder="e.g. Excellent progress on the AI module. Ensure test coverage is complete before final review." style="min-height:90px"></textarea>
        </div>
        <div id="rk_err"></div>
      </div>
      <div class="mf"><div class="sp"></div><button class="btn" onclick="Modal.close()">Cancel</button>
        <button class="btn pri" onclick="Modal.saveRemark('${gid}')">Submit Evaluation</button></div>`);
  },
  saveRemark(gid){
    const txt=document.getElementById('rk_txt').value.trim();
    const grade=document.getElementById('rk_grade').value;
    const score=document.getElementById('rk_score').value.trim();
    const memId=document.getElementById('rk_member').value;
    if(!txt) return Modal.err('rk_err','Write your remark first.');

    const targetM = memId !== 'all' ? user(memId) : null;
    const memberName = targetM ? targetM.name : 'Entire Group';
    const memberRole = targetM ? targetM.role : 'Group Level';

    const remarkData = {
      id: uid(),
      groupId: gid,
      memberId: memId,
      memberName,
      memberRole,
      text: txt,
      grade: grade || null,
      score: score || null,
      by: App.me ? App.me.name : 'Faculty',
      ts: now()
    };
    DB.s.remarks.unshift(remarkData);

    // If Group evaluation, save directly to Group record too
    if (memId === 'all') {
      const gObj = group(gid);
      if (gObj) {
        gObj.evaluation = {
          grade: grade || null,
          score: score || null,
          text: txt,
          by: App.me ? App.me.name : 'Faculty',
          ts: now()
        };
      }
    }

    // Real-time Notification for Student(s)
    const targetUsers = targetM ? [targetM] : membersOf(gid);
    targetUsers.forEach(u => {
      DB.s.notifs = DB.s.notifs || [];
      DB.s.notifs.unshift({
        id: 'nt-' + uid(),
        userId: u.id,
        title: 'New Faculty Remark & Evaluation',
        body: `${App.me ? App.me.name : 'Faculty'} left a remark: "${txt}"${grade ? ` (${grade})` : ''}`,
        ts: now(),
        read: false,
        remarkObj: remarkData
      });
    });

    log(gid, `posted a faculty evaluation remark for <b>${esc(memberName)}</b>`);
    DB.save(); API.push(); FX.tap('done'); Modal.close(); toast(I.pin(15), `Faculty remark posted for ${memberName}`); App.render();
  },

  viewRemarkModal(r){
    if (!r) return;
    const g = group(r.groupId);
    Modal.open(`
      <div class="mh">
        ${I.pin(18)} <h3>Faculty Remark &amp; Evaluation Feedback</h3>
        <button class="btn ico sm gho" onclick="Modal.close()">${I.x(15)}</button>
      </div>
      <div class="mb">
        <div style="border:1px solid var(--line); border-radius:var(--r2); padding:16px; background:var(--surface); display:grid; gap:12px;">
          <div style="display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line-2); padding-bottom:10px;">
            <div>
              <div style="font-weight:700; font-size:15px; color:var(--ink); line-height:1.2">${esc(r.memberName || 'Student Member')}</div>
              <div style="font-size:12px; color:var(--accent); font-weight:600; margin-top:2px">${esc(r.memberRole || 'Team Member')} · ${esc(g ? g.name : 'Group')}</div>
            </div>
            <div style="display:flex; gap:6px;">
              ${r.grade ? `<span class="tag" style="background:var(--green-s); color:var(--green); font-size:14px; font-weight:800; padding:4px 10px">${esc(r.grade)}</span>` : ''}
              ${r.score ? `<span class="tag" style="background:var(--accent-soft); color:var(--accent); font-size:14px; font-weight:800; padding:4px 10px">${esc(r.score)}</span>` : ''}
            </div>
          </div>

          <div>
            <div style="font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; margin-bottom:4px;">Professor Remarks &amp; Feedback</div>
            <div style="font-size:13.5px; color:var(--ink); line-height:1.6; background:var(--surface-2); padding:12px; border-radius:var(--r1); border:1px solid var(--line-2)">
              "${esc(r.text)}"
            </div>
          </div>

          <div style="font-size:11.5px; color:var(--faint); text-align:right;">
            Evaluated by <b>${esc(r.by || 'Faculty')}</b> · ${ago(r.ts)}
          </div>
        </div>
      </div>
      <div class="mf">
        <button class="btn gho" onclick="Modal.close(); App.go('dashboard');">Go to Dashboard</button>
        <div class="sp"></div>
        <button class="btn pri" onclick="Modal.close()">Got it</button>
      </div>
    `);
  },

  confirmReset(){
    Modal.open(`<div class="mh"><h3>Reset demo data?</h3></div>
      <div class="mb"><div class="banner warn">${I.alert(16)}<div>All accounts, groups, tasks and activity return to the original demo dataset. Any accounts you created will be deleted and you will be signed out.</div></div></div>
      <div class="mf"><div class="sp"></div><button class="btn" onclick="Modal.close()">Cancel</button>
        <button class="btn dan" onclick="DB.reset();localStorage.removeItem('${K_SESSION}');location.reload()">Reset everything</button></div>`);
  }
};

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ Modal.close(); const p=document.getElementById('notifPanel'); if(p) p.remove(); } });
document.addEventListener('click',e=>{ const p=document.getElementById('notifPanel'); if(p&&!e.target.closest('.bellwrap')) p.remove(); });
App.boot();
</script>
</body>
</html>
