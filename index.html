        <select class="inp" style="height:28px; font-size:12px; padding:2px 6px; width:190px; cursor:pointer;" 
          onchange="App.activeFacultySubject=this.value; App.render();">
          ${subjs.map(s => {
            const detail = SEM3.find(x => x.code === s.subjectCode) || { name: 'Subject' };
            return `<option value="${s.subjectCode}" ${s.subjectCode === activeSubj ? 'selected' : ''}>Sem ${s.semester} · ${s.subjectCode}</option>`;
          }).join('')}
        </select>
      </div>
    ` : '';

    return `<div class="ph">
        <div><h1>Dashboard</h1><p>Supervised Subject: <b>${esc(subjObj.code)} · ${esc(subjObj.name)}</b></p></div>
        <div class="sp"></div>
        ${subjectSwitcher}
        <button class="btn pri" onclick="Modal.sendSupervisionRequest()">${I.mail(15)} Request Group by Number</button>
      </div>
      <div class="card"><div class="cb" style="padding:30px 22px;text-align:center">
        <div style="display:grid;place-items:center;margin-bottom:12px">${I.folder(26)}</div>
        <div style="font-weight:600;font-size:14px;margin-bottom:5px">Send a supervision request to a Group Number</div>
        <p style="color:var(--muted);font-size:12.5px;max-width:440px;margin:0 auto 16px;line-height:1.6">
          Enter a Group Number (e.g. <b>Group 01</b>) to send a supervision request for <b>${esc(subjObj.code)}</b>. Once the Team Lead accepts, their subject tasks will show here.</p>
        <button class="btn pri" onclick="Modal.sendSupervisionRequest()">${I.mail(15)} Send Request by Group Number</button>
      </div></div>`;
  },

  /* ---------- FACULTY analytics ---------- */
  analytics(){
    const gs=myGroups(); if(!gs.length) return Page.notAssigned();
    const selG = App.analyticsGroupFilter || 'all';
    const activeGs = selG === 'all' ? gs : gs.filter(g => g.id === selG);
    const ids = activeGs.map(g=>g.id), all = DB.s.tasks.filter(t=>ids.includes(t.groupId));
    const students = activeGs.reduce((a,g)=>a+membersOf(g.id).length,0);
    const done = all.filter(t=>t.status==='done').length;
    const blocked = all.filter(t=>t.status==='blocked');
    const overdue = all.filter(t=>t.status!=='done'&&t.due<now());

    /* status donut */
    const statusSegs=STATUSES.map(s=>({label:s.n,c:s.c,value:all.filter(t=>t.status===s.id).length,color:V_(s.c)}));

    /* progress by group (3D columns) */
    const groupCols=activeGs.map((g,i)=>{const p=pctOf(tasksOf(g.id));
      return {label:'G'+String(i+1).padStart(2,'0'),full:g.name+' · '+g.project,value:p,suffix:'%',
        color:p>=70?V_('green'):p>=40?V_('accent'):V_('amber')};});

    /* subject-wise progress */
    const subjMap={}; all.forEach(t=>{const c=t.courseCode||'—';(subjMap[c]=subjMap[c]||[]).push(t);});
    const subjBars=Object.keys(subjMap).map(c=>({label:c+' · '+subjMap[c].length+'t',
      full:((SEM3.find(x=>x.code===c)||{}).name||c),value:pctOf(subjMap[c]),suffix:'%',
      color:V_('accent')})).sort((a,b)=>b.value-a.value);

    /* deadline load (open tasks by due day, −2 … +11) */
    const dmap={}; all.filter(t=>t.status!=='done').forEach(t=>{let d=Math.ceil((t.due-now())/864e5); if(d<-2)d=-2; if(d>11)return; dmap[d]=(dmap[d]||0)+1;});
    const loadPts=[]; for(let d=-2;d<=11;d++) loadPts.push({label:d<0?'−'+(-d):(d===0?'now':'+'+d),value:dmap[d]||0});

    /* top contributors */
    const members=activeGs.flatMap(g=>membersOf(g.id));
    const memRows=members.map(m=>{const mt=tasksFor(m.id).filter(t=>ids.includes(t.groupId));return {m,done:mt.filter(t=>t.status==='done').length,total:mt.length,pct:pctOf(mt)};})
      .sort((a,b)=>b.done-a.done||b.pct-a.pct).slice(0,8);
    const maxDone=Math.max(1,...memRows.map(r=>r.done));

    const attention=[...blocked.map(t=>['red','Blocked',t]),...overdue.sort((a,b)=>a.due-b.due).map(t=>['amber','Overdue',t])].slice(0,7);

    return `
    <div class="ph">
      <div>
        <h1>Analytics</h1>
        <p>Live analysis across ${activeGs.length} group${activeGs.length===1?'':'s'} · ${students} students · ${all.length} tasks</p>
      </div>
      <div class="sp"></div>
      <select class="inp" style="width:170px;height:32px;font-size:12px;cursor:pointer" onchange="App.analyticsGroupFilter=this.value;App.render()">
        <option value="all" ${selG==='all'?'selected':''}>All Groups (${gs.length})</option>
        ${gs.map(g => `<option value="${g.id}" ${selG===g.id?'selected':''}>${esc(g.name)} (${esc(g.project||'Project')})</option>`).join('')}
      </select>
      <button class="btn sm pri" style="margin-left:8px" onclick="Export.analyticsReport('${selG}')">${I.chart(14)} Export Report</button>
      <div class="live" style="margin-left:8px"><i></i>Live</div>
    </div>

    <div class="kpis" style="margin-bottom:16px">
      ${Page.kpi('Overall progress',pctOf(all)+'%',`${done}/${all.length} complete`)}
      ${Page.kpi('In progress',all.filter(t=>t.status==='progress').length,'active now','blue')}
      ${Page.kpi('Blocked',blocked.length,blocked.length?'needs attention':'clear',blocked.length?'red':'green')}
      ${Page.kpi('Overdue',overdue.length,overdue.length?'past due':'on schedule',overdue.length?'amber':'green')}
      ${Page.kpi('Avg / group',Math.round(all.length/gs.length),'tasks per group')}
    </div>

    <div class="chart-grid">
      <div class="card"><div class="ch">${I.board(15)}<h3>Task status distribution</h3></div>
        <div class="cb" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
            ${Charts.donut(statusSegs)}
            <div style="font-size:12px;color:var(--muted)"><b style="color:var(--ink);font-size:14px">${all.length}</b> tasks</div>
          </div>
          <div style="flex:1;min-width:150px;display:grid;gap:7px">
            ${statusSegs.map(s=>`<div style="display:flex;align-items:center;gap:8px;font-size:12.5px">
              <span class="pt" style="width:9px;height:9px;background:${s.color}"></span>
              <span style="flex:1;color:var(--ink-2)">${s.label}</span>
              <b>${s.value}</b><span style="color:var(--faint);width:38px;text-align:right">${all.length?Math.round(100*s.value/all.length):0}%</span></div>`).join('')}
          </div>
        </div></div>

      <div class="card"><div class="ch">${I.trend(15)}<h3>Burndown Trend</h3><div class="sp"></div><span style="font-size:11.5px;color:var(--muted)">Ideal (dashed) vs. Actual remaining</span></div>
        <div class="cb" style="height:150px;">
          ${renderBurndownChart(all)}
        </div></div>

      <div class="card"><div class="ch">${I.chart(15)}<h3>Progress by group</h3></div>
        <div class="cb">${Charts.vbars(groupCols)}
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px">${gs.map((g,i)=>`<span class="tag" style="background:var(--gray-s);color:var(--muted)">G${String(i+1).padStart(2,'0')} · ${esc(g.name.replace('Group ',''))} ${esc(g.project)}</span>`).join('')}</div>
        </div></div>

      <div class="card"><div class="ch">${I.cap(15)}<h3>Subject-wise progress</h3></div>
        <div class="cb">${subjBars.length?Charts.hbars(subjBars):'<div style="color:var(--faint);font-size:12.5px">No subject data.</div>'}</div></div>

      <div class="card"><div class="ch">${I.trend(15)}<h3>Upcoming deadline load</h3><div class="sp"></div>
        <span style="font-size:11.5px;color:var(--muted)">open tasks by due day</span></div>
        <div class="cb">${Charts.area(loadPts,150,V_('accent'))}</div></div>

      <div class="card"><div class="ch">${I.users(15)}<h3>Top contributors</h3></div>
        <div class="cb"><table><tbody>${memRows.map(r=>`<tr>
          <td style="width:34px">${av(r.m,'sm')}</td>
          <td><div style="font-weight:500">${esc(r.m.name)}</div><div style="font-size:11px;color:var(--muted)">${esc(r.m.role)} · ${esc((group(r.m.groupId)||{}).name||'')}</div></td>
          <td style="width:120px"><div class="bar"><i style="width:${Math.round(100*r.done/maxDone)}%;background:var(--green)"></i></div></td>
          <td style="width:70px;text-align:right"><b>${r.done}</b> <span style="color:var(--faint);font-size:11px">/${r.total}</span></td>
        </tr>`).join('')}</tbody></table></div></div>

      <div class="card"><div class="ch">${I.alert(15)}<h3>Needs attention</h3><div class="sp"></div>
        <span class="tag" style="background:${(blocked.length+overdue.length)?'var(--red-s)':'var(--green-s)'};color:${(blocked.length+overdue.length)?'var(--red)':'var(--green)'}">${blocked.length+overdue.length}</span></div>
        <div class="cb" style="display:grid;gap:7px">
          ${attention.length?attention.map(([c,lab,t])=>{const u=user(t.assigneeId);
            return `<div onclick="Modal.task('${t.id}')" style="cursor:pointer;display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r2)">
              ${tag(lab,c)}
              <div style="flex:1;min-width:0"><div style="font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title)}</div>
                <div style="font-size:11px;color:var(--muted)">${esc((group(t.groupId)||{}).name||'')} · ${u?esc(u.name.split(' ')[0]):'—'}${t.courseCode?' · '+esc(t.courseCode):''}</div></div>
              ${I.chev(15)}</div>`;
          }).join(''):`<div class="empty" style="padding:18px">${I.check(22)}<p>Nothing blocked or overdue. 🎉</p></div>`}
        </div></div>
    </div>`;
  },

  groupCard(g,on){
    const ts=tasksOf(g.id), p=pctOf(ts), ms=membersOf(g.id);
    const blocked=ts.filter(t=>t.status==='blocked').length;
    const overdue=ts.filter(t=>t.status!=='done'&&t.due<now()).length;
    
    DB.s.grades = DB.s.grades || [];
    const score = DB.s.grades.find(gr => gr.groupId === g.id);
    return `<div class="gcard" onclick="App.openG('${g.id}')">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="font-weight:600;font-size:14px">${esc(g.name)}</div>
            ${score?`<span class="tag" style="background:var(--green-s);color:var(--green);font-weight:700">Grade: ${esc(score.grade)} (${score.total}/100)</span>`:''}
          </div>
          <div style="color:var(--muted);font-size:12.5px;margin-top:1px">${esc(g.project)}</div>
          <div style="display:flex;gap:5px;margin-top:9px;flex-wrap:wrap">
            ${tag(`${ts.filter(t=>t.status==='done').length}/${ts.length} done`,'green')}
            ${blocked?tag(blocked+' blocked','red'):''}
            ${overdue?tag(overdue+' overdue','amber'):''}
          </div>
        </div>
        ${ring(p,58,p>=70?'green':p>=35?'accent':'amber')}
      </div>
      <div style="margin-top:13px;padding-top:11px;border-top:1px solid var(--line-2);display:grid;gap:7px">
        ${ms.map(m=>{
          const mt=tasksFor(m.id);
          return `<div style="display:flex;align-items:center;gap:8px">
            <div style="position:relative">${av(m,'sm')}${dot(on[m.id])}</div>
            <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name)}</div></div>
            <div>${roleBadge(m.role)}</div>
            <div style="width:52px">${bar(pctOf(mt),'accent')}</div>
            <div style="font-size:11.5px;color:var(--ink-2);width:26px;text-align:right;font-weight:500">${pctOf(mt)}%</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  },

  groups(){
    const on=online(), gs=myGroups();
    if(!gs.length) return Page.notAssigned();
    const selSem = App.facGroupSemFilter || 'all';
    const filteredGs = selSem === 'all' ? gs : gs.filter(g => String(g.semester || 3) === String(selSem));

    return `<div class="ph">
        <div>
          <h1>Groups</h1>
          <p>Supervising ${gs.length} group${gs.length===1?'':'s'} · ${filteredGs.length} shown</p>
        </div>
        <div class="sp"></div>
        <select class="inp" style="width:165px;height:32px;font-size:12px;cursor:pointer" onchange="App.facGroupSemFilter=this.value;App.render()">
          <option value="all" ${selSem==='all'?'selected':''}>All Semesters (1-8)</option>
          ${[1,2,3,4,5,6,7,8].map(s => `<option value="${s}" ${selSem===String(s)?'selected':''}>Semester ${s}</option>`).join('')}
        </select>
        ${App.isFaculty ? `<button class="btn pri sm" style="margin-left:8px" onclick="Modal.sendSupervisionRequest()">${I.mail(14)} Add Group</button>` : ''}
        ${App.isFaculty ? `<button class="btn sm" style="margin-left:8px" onclick="Export.gradesCSV()">${I.cap(14)} Export Grades Sheet</button>` : ''}
      </div>
      ${filteredGs.length ? `
        <div class="grid3">${filteredGs.map(g=>Page.groupCard(g,on)).join('')}</div>
      ` : `
        <div class="card"><div class="empty">${I.folder(24)}<div class="h">No groups in Semester ${esc(selSem)}</div><p>Try switching the semester filter dropdown above.</p></div></div>
      `}`;
  },

  people(){
    const on=online(), gs=myGroups();
    if(!gs.length) return Page.notAssigned();
    return `<div class="ph">
        <div><h1>People</h1><p>Students in the groups you supervise</p></div>
        <div class="sp"></div>
        ${App.isFaculty ? `<button class="btn sm pri" onclick="Export.remarksCSV('all')">${I.chart(14)} Export All Remarks CSV</button>` : ''}
      </div>
      ${gs.map(g=>{
        const ms=membersOf(g.id);
        return `<div class="card" style="margin-bottom:14px">
          <div class="ch"><h3>${esc(g.name)} — ${esc(g.project)}</h3>
            <div class="sp"></div>
            ${App.isFaculty ? `<button class="btn sm pri" onclick="Export.remarksCSV('${g.id}')">${I.chart(13)} Export CSV</button>` : ''}
            <button class="btn sm gho" onclick="App.openG('${g.id}')">Open Group</button></div>
          <table><thead><tr><th style="width:25%">Member</th><th>Role</th><th>Email</th><th>Individual Faculty Remark</th><th style="width:140px">Task Progress</th></tr></thead>
          <tbody>${ms.map(m=>{
            const mt=tasksFor(m.id);
            const mRemarks=DB.s.remarks.filter(r=>r.groupId===g.id && r.memberId===m.id);
            const latestR=mRemarks[0];
            return `<tr>
              <td><div style="display:flex;align-items:center;gap:8px"><div style="position:relative">${av(m,'sm')}${dot(on[m.id])}</div>
                <div><div style="font-weight:600">${esc(m.name)}</div>${on[m.id]?'<div style="font-size:11px;color:var(--green)">online</div>':''}</div></div></td>
              <td>${roleBadge(m.role)}</td>
              <td><span class="mono" style="color:var(--muted)">${esc(m.email)}</span></td>
              <td>
                ${latestR ? `<div style="font-size:12px;color:var(--ink);font-weight:500">${esc(latestR.text)} ${latestR.grade ? `<span class="tag" style="background:var(--green-s);color:var(--green);font-weight:700">${esc(latestR.grade)}</span>` : ''}</div>` : (App.isFaculty ? `<button class="btn sm pri" onclick="Modal.remark('${g.id}', '${m.id}')">${I.pin(13)} Add Member Remark</button>` : `<span style="color:var(--faint)">No remark yet</span>`)}
              </td>
              <td><div style="display:flex;align-items:center;gap:8px">${bar(pctOf(mt),'accent')}<b style="font-size:12px;width:30px;text-align:right">${pctOf(mt)}%</b></div></td>
            </tr>`;
          }).join('')}</tbody></table>
        </div>`;
      }).join('')}`;
  },

  activity(gid){
    let list;
    if(gid) list=DB.s.activity.filter(a=>a.groupId===gid);
    else{
      const ids=myGroups().map(g=>g.id);
      if(!ids.length) return Page.notAssigned();

      <div class="card">${Page.feed(list)}</div>`;

  /* ---------- shared group detail ---------- */

                      <div style="font-size:11.5px; color:var(--muted); margin-top:4px">${esc(item.desc || 'No description.')}</div>
                    </div>
                    <div style="display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--line-2); padding-top:8px;">

          ` : `
            <div class="empty" style="padding:18px 14px">
              ${I.folder(24)}
              <div class="h">No project deliverables uploaded yet</div>
              <p style="font-size:12.5px; color:var(--muted); max-width:420px; margin:4px auto 10px">
                Team Leads can directly upload PPT presentation slides, PDF project reports/research papers, ZIP code files, or share web links for faculty inspection.
              </p>
              ${isLead ? `<button class="btn pri sm" onclick="Modal.addDeliverable('${g.id}')">${I.plus(14)} Upload First File</button>` : ''}

          `}

      </div>

        allDeliverables.push({ ...d, groupName: g.name, groupProject: g.project, groupId: g.id, deliverableIdx: idx });
      });
    });

          <h1>Deliverables</h1>
          <p>Central repository for Project PPTs, Reports, Research Papers &amp; Source Code</p>

        ${Page.kpi('PPT Presentations', allDeliverables.filter(d=>d.type==='ppt').length, 'slides & Canva decks', 'amber')}
        ${Page.kpi('PDF Reports / Papers', allDeliverables.filter(d=>d.type==='report').length, 'project documentation', 'blue')}

      <div class="card">

        </div>
        <div class="cb">
          ${allDeliverables.length ? `
            <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px">
              ${allDeliverables.map(item => {

  /* ---------- SUPERVISION REQUESTS PAGE (Team Lead / Members) ---------- */
  requestsPage(){
    const g = group(App.me.groupId);
    if (!g) return Page.noGroup();

    DB.s.invites = DB.s.invites || [];

    const pending  = DB.s.invites.filter(i => i.groupId === g.id && i.status === 'pending');
    const accepted = DB.s.invites.filter(i => i.groupId === g.id && i.status === 'accepted');
    const declined = DB.s.invites.filter(i => i.groupId === g.id && i.status === 'declined');

    const renderRow = (inv, showActions) => {
      const c = SEM3.find(s => s.code === inv.subjectCode) || { code: inv.subjectCode, name: 'Subject' };
      const fUser = user(inv.facultyId);
      const statusTag = inv.status === 'accepted'
        ? `<span class="tag" style="background:var(--green-s);color:var(--green)">✓ Accepted</span>`
        : inv.status === 'declined'
        ? `<span class="tag" style="background:var(--red-s);color:var(--red)">✗ Declined</span>`
        : `<span class="tag" style="background:var(--amber-s);color:var(--amber);display:inline-flex;align-items:center;gap:4px">${I.clock(12)} Pending</span>`;

      return `
        <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);margin-bottom:9px">
          <div style="width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none">${I.users(20)}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:13.5px">${esc(inv.facultyName)}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:1px">${esc(inv.facultyEmail)}</div>
            <div style="display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap">
              <span class="mono" style="background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);border-radius:5px;padding:2px 7px;font-size:11px;font-weight:700">${esc(c.code)}</span>
              <span style="font-size:12px;color:var(--ink-2)">${esc(c.name)}</span>
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:3px">Requested: ${ago(inv.ts)}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
            ${statusTag}
            ${showActions && App.isLead ? `
              <div style="display:flex;gap:7px">
                <button class="btn sm pri" onclick="Page.respondInvite('${inv.id}','accept')">${I.check(13)} Accept</button>
                <button class="btn sm dan" onclick="Page.respondInvite('${inv.id}','decline')">${I.x(13)} Decline</button>
              </div>` : ''}
          </div>
        </div>
      `;
    };

    return `
      <div class="ph">
        <div>
          <h1>Supervision Requests</h1>
          <p>${g.name} · Incoming faculty supervision requests</p>
        </div>
        <div class="sp"></div>
        <button class="btn pri" onclick="API.check().then(()=>{App.render();toast(I.check(15),'Refreshed from server');})">${I.activity(15)} Sync from Server</button>
      </div>
      <div class="banner info" style="margin-bottom:14px">
        ${I.activity(16)}
        <div><b>How requests arrive:</b> Faculty sends a Group Number request → it's saved on the local backend (localhost:4000) → when you click <b>Sync from Server</b> or wait up to 8 seconds, it appears here. Both users must be connected to the same backend.</div>
      </div>

      ${pending.length ? `
        <div class="card" style="margin-bottom:16px;border:2px solid var(--amber)">
          <div class="ch" style="background:var(--amber-s);border-radius:var(--r2) var(--r2) 0 0">
            ${I.mail(18)} <h3 style="color:var(--amber)">Pending — Action Required (${pending.length})</h3>
            <div class="sp"></div>
            ${App.isLead ? '' : `<span style="font-size:12px;color:var(--muted);font-style:italic">Only Team Lead can accept/decline</span>`}
          </div>
          <div class="cb">${pending.map(i => renderRow(i, true)).join('')}</div>
        </div>
      ` : `
        <div class="card" style="margin-bottom:16px">
          <div class="cb" style="text-align:center;padding:28px 20px">
            <div style="display:flex;justify-content:center;margin-bottom:10px;color:var(--faint)">${I.inbox(32)}</div>
            <div style="font-weight:600;font-size:14px;margin-bottom:6px">No pending supervision requests</div>
            <p style="color:var(--muted);font-size:12.5px">When a faculty member sends a Group Number supervision request, it will appear here for the Team Lead to accept or decline.</p>
          </div>
        </div>
      `}

      ${accepted.length ? `
        <div class="card" style="margin-bottom:16px">
          <div class="ch">${I.check(16)}<h3 style="color:var(--green)">✓ Accepted Requests (${accepted.length})</h3></div>
          <div class="cb">${accepted.map(i => renderRow(i, false)).join('')}</div>
        </div>
      ` : ''}

      ${declined.length ? `
        <div class="card" style="margin-bottom:16px">
          <div class="ch">${I.x(16)}<h3 style="color:var(--red)">✗ Declined Requests (${declined.length})</h3></div>
          <div class="cb">${declined.map(i => renderRow(i, false)).join('')}</div>
        </div>
      ` : ''}
    `;
  },

  saveSettingsProfile(){
    const nameEl = document.getElementById('set_name');
    const emailEl = document.getElementById('set_email');
    if (!nameEl || !emailEl) return;

    const name = nameEl.value.trim();
    const email = emailEl.value.trim();

    if (!name) return toast(I.alert(15), 'Name cannot be empty.');
    if (!emailOk(email)) return toast(I.alert(15), 'Please enter a valid email.');

    const existing = DB.s.users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.id !== App.me.id);
    if (existing) return toast(I.alert(15), 'This email is already in use by another account.');

    let subjects = [];
    let primarySem = 3;
    let primarySubj = '';
    
    if (App.isFaculty) {
      const chks = document.querySelectorAll('.set-fac-subj-chk:checked');
      if (!chks.length) return toast(I.alert(15), 'Please select at least one teaching subject.');
      chks.forEach((chk, idx) => {
        const semVal = parseInt(chk.dataset.sem, 10);
        const code = chk.value;
        subjects.push({ semester: semVal, subjectCode: code });
        if (idx === 0) {
          primarySem = semVal;
          primarySubj = code;
        }
      });
    }

    const u = user(App.me.id);
    if (u) {
      u.name = name;
      u.email = email;
      App.me.name = name;
      App.me.email = email;

      if (App.isFaculty) {
        u.subjectCode = primarySubj;
        u.semester = primarySem;
        u.subjects = subjects;
        App.me.subjectCode = primarySubj;
        App.me.semester = primarySem;
        App.me.subjects = subjects;
      }

      DB.save();
      API.push();
      FX.tap('done');
      toast(I.check(15), 'Profile settings saved successfully!');
      App.render();
    }
  },

  changePasswordSettings(){
    const oEl = document.getElementById('set_cp_old');
    const nEl = document.getElementById('set_cp_new');
    const n2El = document.getElementById('set_cp_new2');
    const errEl = document.getElementById('set_cp_err');
    if (!oEl || !nEl || !n2El) return;

    const o = oEl.value;
    const n = nEl.value;
    const n2 = n2El.value;

    if (hash(o) !== App.me.pass) {
      if (errEl) errEl.innerHTML = `<div class="errmsg">${I.alert(13)}Current password is incorrect.</div>`;
      FX.tap('error');
      return;
    }
    if (n.length < 6) {
      if (errEl) errEl.innerHTML = `<div class="errmsg">${I.alert(13)}New password must be at least 6 characters.</div>`;
      FX.tap('error');
      return;
    }
    if (n !== n2) {
      if (errEl) errEl.innerHTML = `<div class="errmsg">${I.alert(13)}The two new passwords do not match.</div>`;
      FX.tap('error');
      return;
    }

    const u = user(App.me.id);
    if (u) {
      u.pass = hash(n);
      App.me.pass = hash(n);
      DB.save();
      API.push();
      FX.tap('done');
      toast(I.check(15), 'Password updated successfully!');
      if (errEl) errEl.innerHTML = '';
      oEl.value = ''; nEl.value = ''; n2El.value = '';
    }
  },

/* ============================================================
   SPARKLE — celebratory burst when a task is completed
   ============================================================ */
const Sparkle={
  star:'<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.6l2.5 7.9L22 12l-7.5 2.5L12 22.4 9.5 14.5 2 12l7.5-2.5z"/></svg>',
  burst(el){
    if(!el||!el.getBoundingClientRect) return;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    const r=el.getBoundingClientRect();
    if(!r.width) return;
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const cols=['#1E8A5C','#2B6777','#B0761A','#2E6FD9','#3FB86A','#52AB98'];
    const layer=document.createElement('div'); layer.className='sparkle-layer';
    const N=16;
    for(let i=0;i<N;i++){
      const sp=document.createElement('span'); sp.className='sparkle';
      const ang=(Math.PI*2*i/N)+(Math.random()-.5)*.6, dist=32+Math.random()*52, sc=.6+Math.random()*.8;
      sp.style.left=cx+'px'; sp.style.top=cy+'px'; sp.style.color=cols[i%cols.length];
      sp.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(1)+'px');
      sp.style.setProperty('--dy',(Math.sin(ang)*dist).toFixed(1)+'px');
      sp.style.setProperty('--rot',(Math.random()*220-110)+'deg');
      sp.style.animationDelay=(Math.random()*70)+'ms';
      sp.style.fontSize=0; sp.style.transformOrigin='center';
      sp.innerHTML=Sparkle.star;
      const svg=sp.firstChild; if(svg) svg.style.transform='scale('+sc.toFixed(2)+')';
      layer.appendChild(sp);
    }
    document.body.appendChild(layer);
    setTimeout(()=>layer.remove(),950);
  }
};

/* ============================================================
   CONFETTI — celebration popup + confetti burst on completion
   ============================================================ */
const Confetti={
  celebrate(originEl){
    Confetti.popup();
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    let ox=window.innerWidth/2, oy=window.innerHeight*0.5;
    if(originEl && originEl.getBoundingClientRect){ const r=originEl.getBoundingClientRect(); if(r.width){ ox=r.left+r.width/2; oy=r.top+r.height/2; } }
    Confetti.fire(ox,oy);
  },
  popup(){
    // Floating popup badge disabled as requested
  },
  fire(ox,oy){
    const W=window.innerWidth, H=window.innerHeight, dpr=Math.min(2,window.devicePixelRatio||1);
    const cv=document.createElement('canvas'); cv.className='confetti-canvas';
    cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
    document.body.appendChild(cv);
    const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
    const cols=['#2B6777','#1E8A5C','#B0761A','#CE4A45','#2E6FD9','#52AB98','#3FB86A','#E0A82E'];
    const N=120, P=[];
    for(let i=0;i<N;i++){
      const ang=-Math.PI/2 + (Math.random()-.5)*2.3, spd=6+Math.random()*9.5;
      P.push({x:ox,y:oy,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
        w:5+Math.random()*6,h:8+Math.random()*7,rot:Math.random()*6.28,vr:(Math.random()-.5)*.42,
        col:cols[i%cols.length],round:Math.random()<.35});
    }
    const g=0.3, drag=0.995, start=performance.now();
    (function frame(t){
      const el=t-start; ctx.clearRect(0,0,W,H); let alive=false;
      const fade=el>1500?Math.max(0,1-(el-1500)/750):1;
      for(const p of P){
        p.vy+=g; p.vx*=drag; p.vy*=drag; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
        if(p.y<H+40 && fade>0) alive=true;
        ctx.save(); ctx.globalAlpha=fade; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col;
        if(p.round){ ctx.beginPath(); ctx.arc(0,0,p.w/2,0,6.283); ctx.fill(); }
        else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx.restore();
      }
      if(alive && el<3000) requestAnimationFrame(frame); else cv.remove();
    })(start);
  }
};



/* ============================================================
   TILT — subtle mouse-follow 3D on dashboard tiles
   ============================================================ */
const Tilt={
  bind(){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    document.querySelectorAll('.kpi,.gcard,.ai-card').forEach(el=>{
      if(el.dataset.tilt) return; el.dataset.tilt='1';
      el.addEventListener('pointermove',e=>{
        if(e.pointerType && e.pointerType!=='mouse') return;
        const r=el.getBoundingClientRect();
        const px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
        el.classList.add('tilting');
        /* !important beats the card's entrance animation, which otherwise overrides inline transform */
        el.style.setProperty('transform',`perspective(780px) rotateX(${(-py*10).toFixed(2)}deg) rotateY(${(px*12).toFixed(2)}deg) translateZ(14px)`,'important');
        el.style.setProperty('box-shadow',`${(-px*26).toFixed(0)}px ${(20-py*12).toFixed(0)}px 40px rgba(16,24,40,.22)`,'important');
      });
      el.addEventListener('pointerleave',()=>{ el.classList.remove('tilting'); el.style.removeProperty('transform'); el.style.removeProperty('box-shadow'); });
    });
  }
};

const Board={
  flash:null,
  _rects:null,
  /* snapshot every card's screen position just before a re-render */
  capture(){ const m={}; document.querySelectorAll('.tc[data-id]').forEach(c=>{
    const r=c.getBoundingClientRect(); m[c.dataset.id]={x:r.left,y:r.top}; }); return m; },
  /* FLIP: cards that existed before glide from their old spot to the new one;
     genuinely new cards keep the CSS pop-in instead */
  flipApply(){
    const old=Board._rects; Board._rects=null;
    const cards=document.querySelectorAll('.tc[data-id]'); if(!cards.length) return;
    const reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    cards.forEach(c=>{
      const o=old&&old[c.dataset.id];
      if(!o) return;                 // new card → let the pop entrance play
      if(c.dataset.id!==Board.flash) c.style.animation='none'; // keep the green done-flash on the completed card
      if(reduce) return;
      const r=c.getBoundingClientRect(), dx=o.x-r.left, dy=o.y-r.top;
      if(Math.abs(dx)<1 && Math.abs(dy)<1) return;
      c.style.transition='none'; c.style.transform=`translate(${dx}px,${dy}px)`;

  ganttHTML(g, tasks) {
    if (!tasks || !tasks.length) {
      return `<div class="empty" style="padding:40px">${I.board(24)}<p>No tasks scheduled to build Gantt chart.</p></div>`;
    }

    const projectStart = new Date('2026-08-01').getTime();
    const projectEnd = new Date('2026-10-31').getTime();
    const totalDuration = projectEnd - projectStart;

    let weekMarkers = [];
    const step = 7 * 24 * 3600 * 1000;
    for (let time = projectStart; time <= projectEnd; time += step) {
      const left = (100 * (time - projectStart) / totalDuration).toFixed(2);
      weekMarkers.push(`<div style="position:absolute; left:${left}%; top:0; bottom:0; border-left:1px dashed var(--line-2); pointer-events:none;"></div>`);
    }

    return `
      <div style="position:relative; border:1px solid var(--line); border-radius:var(--r2); background:var(--surface); overflow-x:auto;">
        <div style="display:flex; border-bottom:1px solid var(--line); min-width:640px; background:var(--surface-2); font-weight:700; font-size:11px; text-transform:uppercase; color:var(--muted)">
          <div style="width:160px; padding:10px 14px; border-right:1px solid var(--line); flex-shrink:0;">Project Tasks</div>
          <div style="flex:1; display:flex; position:relative;">
            <div style="width:33.3%; padding:10px 0; text-align:center; border-right:1px solid var(--line);">August 2026</div>
            <div style="width:33.3%; padding:10px 0; text-align:center; border-right:1px solid var(--line);">September 2026</div>
            <div style="width:33.4%; padding:10px 0; text-align:center;">October 2026</div>
          </div>
        </div>

        <div style="position:relative; min-width:640px; display:flex; flex-direction:column; padding:10px 0;">
          ${weekMarkers.join('')}

          ${tasks.map(t => {
            const u = user(t.assigneeId);
            const st = stat(t.status);
            const pr = t.progress || 0;
            const tStart = t.createdAt || projectStart;
            const tEnd = t.due || projectEnd;
            
            const left = Math.max(0, Math.min(95, 100 * (tStart - projectStart) / totalDuration));
            const right = Math.max(5, Math.min(100, 100 * (tEnd - projectStart) / totalDuration));
            const width = Math.max(12, right - left);

            let barColor = 'var(--accent)';
            if (t.status === 'done') barColor = 'var(--green)';
            else if (t.status === 'blocked') barColor = 'var(--red)';
            else if (t.status === 'progress') barColor = 'var(--blue)';

            return `
              <div style="display:flex; align-items:center; border-bottom:1px solid var(--line-2); padding:8px 0; position:relative;" class="gantt-row">
                <div style="width:160px; padding:0 14px; border-right:1px solid var(--line-2); flex-shrink:0; font-weight:600; font-size:12px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(t.title)}">
                  ${esc(t.title)}
                </div>

                <div style="flex:1; position:relative; height:32px; display:flex; align-items:center;">
                  <div style="position:absolute; left:${left.toFixed(2)}%; width:${width.toFixed(2)}%; height:20px; background:${barColor}15; border:1px solid ${barColor}50; border-radius:4px; display:flex; align-items:center; padding:0 6px; cursor:pointer; transition:transform 0.15s;" 
                    onclick="Modal.task('${t.id}')"
                    title="${esc(t.title)} (${pr}% Complete) - Due ${dueOf(t.due).t}">
                    <div style="position:absolute; left:0; top:0; bottom:0; width:${pr}%; background:${barColor}26; border-radius:3px 0 0 3px; pointer-events:none;"></div>
                    
                    <span style="font-size:10px; font-weight:700; color:${barColor}; z-index:2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">
                      ${pr}% ${u ? '· ' + esc(u.name.split(' ')[0]) : ''}
                    </span>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  },

  bind(){
    Board.flipApply();
    let dragged=null;
    document.querySelectorAll('.tc[draggable="true"]').forEach(c=>{
      c.addEventListener('dragstart',e=>{ dragged=c.dataset.id; c.classList.add('dragging');
        e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',dragged);}catch(x){} FX.tap('pick'); });
      c.addEventListener('dragend',()=>{ c.classList.remove('dragging'); dragged=null;
        document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over')); });
    });
    document.querySelectorAll('.col').forEach(col=>{
      col.addEventListener('dragover',e=>{ if(!dragged) return; e.preventDefault(); e.dataTransfer.dropEffect='move';
        if(!col.classList.contains('over')){ col.classList.add('over'); FX.tap('hover'); } });
      col.addEventListener('dragleave',e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('over'); });
      col.addEventListener('drop',e=>{ e.preventDefault(); col.classList.remove('over');
        const id=dragged||e.dataTransfer.getData('text/plain'); if(id) Board.move(id,col.dataset.status); dragged=null; });
    });
    /* let the green completion flash play once, then stop re-triggering it on later renders */
    if(Board.flash) setTimeout(()=>{ Board.flash=null; },1000);
  },

  move(id,status){
    const t=DB.s.tasks.find(x=>x.id===id);
    if(!t||t.status===status) return;
    if(!Board.canEdit(t)){ FX.tap('error'); return toast(I.lock(15),'You can only move tasks assigned to you'); }
    const from=stat(t.status).n, to=stat(status).n;
    t.status=status; t.updatedAt=now();
    Board.flash = status==='done' ? id : null;
    if(status==='done') t.progress=100;
    else if(status==='todo') t.progress=Math.min(t.progress,15);
    else if(t.progress===0) t.progress=10;
    else if(t.progress===100) t.progress=90;
    log(t.groupId,`moved <b>${esc(t.title)}</b> from ${from} to <b>${to}</b>`);
    DB.save(); FX.tap(status==='done'?'done':'drop');
    toast(status==='done'?I.check(15):I.arrow(15), status==='done'?`Completed: ${t.title}`:`Moved to ${to}`);
    App.render();
    if(status==='done') {
      FX.confetti();
      setTimeout(()=>Confetti.celebrate(document.querySelector(`.tc[data-id="${id}"]`)),180);
    }
  }
};

  scope(){

      const gs=myGroups(), ids=gs.map(g=>g.id);

                                   : (App.me.groupId?membersOf(App.me.groupId):[]); },

  /* ---- insight signals ---- */
  insights(){
    const {tasks}=AI.scope(); const out=[];
    const overdue=tasks.filter(t=>t.status!=='done'&&t.due<now()).sort((a,b)=>a.due-b.due);
    const blocked=tasks.filter(t=>t.status==='blocked');
    const risk=tasks.filter(t=>t.status!=='done'&&t.due>=now()&&t.due-now()<3*864e5&&t.progress<60);
    if(blocked.length) out.push({c:'red',icon:I.alert,conf:'High',
      title:`${blocked.length} blocked task${blocked.length>1?'s':''} stalling progress`,
      desc:`${esc(blocked.slice(0,2).map(t=>t.title).join(', '))}${blocked.length>2?'…':''} — clearing these first unblocks the most work.`});
    if(overdue.length) out.push({c:'amber',icon:I.clock,conf:'High',
      title:`${overdue.length} task${overdue.length>1?'s are':' is'} past the due date`,
      desc:`Oldest: <b>${esc(overdue[0].title)}</b>, ${dueOf(overdue[0].due).t}.`});
    if(risk.length) out.push({c:'blue',icon:I.trend,conf:'Medium',
      title:`${risk.length} deadline${risk.length>1?'s':''} at risk this week`,
      desc:`Due within 3 days but under 60% complete — current pace suggests a likely slip.`});
    const ms=AI.members();
    if(ms.length>1){
      const rows=ms.map(m=>({m,open:tasksFor(m.id).filter(t=>t.status!=='done').length}));
      const avg=rows.reduce((a,r)=>a+r.open,0)/rows.length;
      const max=rows.reduce((a,b)=>b.open>a.open?b:a);
      if(max.open>=avg+2&&max.open>=3) out.push({c:'amber',icon:I.scale,conf:'Medium',
        title:`Workload looks uneven`,
        desc:`${esc(max.m.name.split(' ')[0])} is carrying ${max.open} open tasks vs a team average of ${avg.toFixed(1)}. Consider rebalancing.`});
    }
    const p=pctOf(tasks);
    const doneRecent=tasks.filter(t=>t.status==='done'&&now()-t.updatedAt<7*864e5).length;
    out.push({c:p>=70?'green':'accent',icon:I.trend,conf:'High',bar:p,
      title:`Overall completion at ${p}%`,
      desc:`${doneRecent} task${doneRecent===1?'':'s'} completed in the last 7 days across ${tasks.length} tracked.`});

  seed(){
    const {tasks}=AI.scope();
    const overdue=tasks.filter(t=>t.status!=='done'&&t.due<now()).length;
    const blocked=tasks.filter(t=>t.status==='blocked').length;
    const nm=App.me.name.split(' ')[0];
    AI.msgs=[{r:'a',html:`Hi ${esc(nm)} 👋 I'm your Pro Track AI assistant. I've scanned ${App.isFaculty?'the groups you supervise':'your project'} — <b>${tasks.length}</b> tasks in total${overdue?`, <b>${overdue}</b> overdue`:''}${blocked?` and <b>${blocked}</b> blocked`:''}. Ask me anything, or tap a suggestion below.`}];
  },

  bubble(msg){
    if(msg.r==='u') return `<div class="msg u"><div class="mtx">${msg.html}</div></div>`;
    const body=msg.typing?`<div class="typing"><span></span><span></span><span></span></div>`:msg.html;
    return `<div class="msg a"><div class="mav">${I.spark(15)}</div><div class="mtx">${body}</div></div>`;
  },

  chatHTML(){
    if(!AI.msgs.length) AI.seed();
    return `<div class="chatwrap">
      <div class="chatlog" id="chatlog">${AI.msgs.map(AI.bubble).join('')}</div>
      <div class="chips">${AI.prompts().map(p=>`<button class="chip" onclick="AI.ask('${p}')">${p}</button>`).join('')}</div>
      <div class="chatin">
        <input class="inp" id="aiIn" placeholder="Ask about deadlines, workload or risks…" onkeydown="if(event.key==='Enter'){AI.ask(this.value);this.value=''}"/>
        <button class="btn pri ico" onclick="var i=document.getElementById('aiIn');AI.ask(i.value);i.value=''">${I.send(15)}</button>
      </div></div>`;
  },

  render(){ if(App.tab==='assistant') App.render(); },
  bind(){ const l=document.getElementById('chatlog'); if(l) l.scrollTop=l.scrollHeight; },

  ask(text){
    text=(text||'').trim(); if(!text) return;
    if(App.tab!=='assistant'){ App.tab='assistant'; }
    if(!AI.msgs.length) AI.seed();
    AI.msgs.push({r:'u',html:esc(text)});
    AI.msgs.push({r:'a',typing:true});
    FX.tap('med'); App.render();
    const ans=AI.answer(text);
    setTimeout(()=>{
      AI.msgs[AI.msgs.length-1]={r:'a',html:ans};
      if(App.tab==='assistant') App.render(); else Notify.paint();
      FX.tap('light');
    }, 540+Math.random()*380);
  },

  answer(q){
    const s=q.toLowerCase();
    if(/(overload|workload|balance|busy|distribut|who.*(most|doing))/.test(s)) return AI.aWorkload();
    if(/(deadline|due|predict|forecast|late|miss|slip|risk)/.test(s)) return AI.aDeadlines();
    if(/(attention|urgent|behind|problem|wrong|blocked|stuck|issue)/.test(s)) return AI.aAttention();
    if(/(focus|next|priorit|should i|what.*do|start)/.test(s)) return AI.aFocus();
    if(/(summar|overview|status|progress|how.*(going|doing|team)|report|group)/.test(s)) return AI.aSummary();
    if(/(help|hi|hello|hey|what can you|capab)/.test(s)) return AI.aHelp();
    return AI.aHelp(true);
  },

  _line(t){ const u=user(t.assigneeId), d=dueOf(t.due); return `${esc(t.title)} <span style="color:var(--faint)">— ${u?esc(u.name.split(' ')[0]):'unassigned'}, ${d.t}${App.isFaculty?', '+esc(group(t.groupId).name):''}</span>`; },

  aAttention(){
    const {tasks}=AI.scope();
    const blocked=tasks.filter(t=>t.status==='blocked');
    const overdue=tasks.filter(t=>t.status!=='done'&&t.due<now()).sort((a,b)=>a.due-b.due);
    const risk=tasks.filter(t=>t.status!=='done'&&t.due>=now()&&t.due-now()<3*864e5&&t.progress<60);
    if(!blocked.length&&!overdue.length&&!risk.length)
      return `Good news — nothing urgent in scope. No blocked, overdue or at-risk tasks right now. ✅ Keep the momentum going.`;
    const rows=[...blocked.map(t=>['🔴 <b>Blocked</b>',t]),...overdue.map(t=>['🟠 <b>Overdue</b>',t]),...risk.map(t=>['🟡 <b>At risk</b>',t])].slice(0,6);
    return `Here's what I'd prioritise, most critical first:<ul>${rows.map(([lab,t])=>`<li>${lab} — ${AI._line(t)}</li>`).join('')}</ul>Tap any of these in the board to update its status.`;
  },

  aDeadlines(){
    const {tasks}=AI.scope();
    const open=tasks.filter(t=>t.status!=='done');
    const missed=open.filter(t=>t.due<now());
    const high=open.filter(t=>t.due>=now()&&t.due-now()<2*864e5&&t.progress<70);
    const at=open.filter(t=>t.due>=now()&&t.due-now()>=2*864e5&&t.due-now()<5*864e5&&t.progress<40);
    const okN=open.length-missed.length-high.length-at.length;
    if(!open.length) return `There are no open tasks with deadlines to forecast — everything is complete. 🎉`;
    let h=`Deadline forecast across ${open.length} open task${open.length>1?'s':''}:<ul>`;
    h+=`<li>🔴 <b>${missed.length}</b> already past due</li>`;
    h+=`<li>🟠 <b>${high.length}</b> high risk (due ≤2 days, under 70%)</li>`;
    h+=`<li>🟡 <b>${at.length}</b> at risk (due this week, low progress)</li>`;
    h+=`<li>🟢 <b>${Math.max(0,okN)}</b> on track</li></ul>`;
    const worst=[...missed,...high].sort((a,b)=>a.due-b.due).slice(0,3);
    if(worst.length) h+=`Most likely to slip:<ul>${worst.map(t=>`<li>${AI._line(t)} at ${t.progress}%</li>`).join('')}</ul>`;
    return h;
  },

  aWorkload(){
    const ms=AI.members();
    if(!ms.length) return `I couldn't find any members in scope to analyse.`;
    const rows=ms.map(m=>({m,open:tasksFor(m.id).filter(t=>t.status!=='done').length,pct:pctOf(tasksFor(m.id))})).sort((a,b)=>b.open-a.open);
    const avg=rows.reduce((a,r)=>a+r.open,0)/rows.length;
    let h=`Current workload (open tasks):<ul>${rows.map(r=>`<li>${esc(r.m.name.split(' ')[0])} <span style="color:var(--faint)">(${esc(r.m.role)})</span> — <b>${r.open}</b> open · ${r.pct}% done</li>`).join('')}</ul>`;
    const top=rows[0], low=rows[rows.length-1];
    if(top.open-low.open>=3) h+=`⚖️ <b>${esc(top.m.name.split(' ')[0])}</b> is the busiest with ${top.open} open tasks (team avg ${avg.toFixed(1)}). Moving one or two to <b>${esc(low.m.name.split(' ')[0])}</b> would even things out.`;
    else h+=`The load looks fairly balanced — the spread is within a couple of tasks of the ${avg.toFixed(1)} average.`;
    return h;
  },

  aFocus(){
    if(App.isFaculty){
      const gs=myGroups();
      if(!gs.length) return `No groups are assigned to you yet, so there's nothing to focus on.`;
      const ranked=gs.map(g=>({g,p:pctOf(tasksOf(g.id)),
        risk:tasksOf(g.id).filter(t=>t.status==='blocked'||(t.status!=='done'&&t.due<now())).length}))
        .sort((a,b)=>(b.risk-a.risk)||(a.p-b.p));
      const w=ranked[0];
      return `I'd check in on <b>${esc(w.g.name)}</b> first — ${w.p}% complete with <b>${w.risk}</b> blocked/overdue task${w.risk===1?'':'s'}. ${w.risk?'Leaving a remark on the group page would help them unblock.':'It is simply the furthest behind on progress.'}`;
    }
    const mine=tasksFor(App.me.id).filter(t=>t.status!=='done');
    if(!mine.length) return `You have no open tasks — nothing to focus on right now. Nice. 🎉`;
    const rank=mine.slice().sort((a,b)=>{
      const oa=a.due<now()?0:1, ob=b.due<now()?0:1;
      if(oa!==ob) return oa-ob;
      const pr=PRIOS.map(p=>p.id); if(a.prio!==b.prio) return pr.indexOf(b.prio)-pr.indexOf(a.prio);
      return a.due-b.due;
    });
    const top=rank.slice(0,2);
    return `Based on due date and priority, focus on:<ul>${top.map((t,i)=>`<li><b>${i+1}.</b> ${esc(t.title)} <span style="color:var(--faint)">— ${prio(t.prio).n} priority, ${dueOf(t.due).t}, ${t.progress}% done</span></li>`).join('')}</ul>Clear the ${top[0].due<now()?'overdue one':'top item'} first, then move it along on the board.`;
  },

  aSummary(){
    if(App.isFaculty){
      const gs=myGroups();
      if(!gs.length) return `No groups are assigned to you yet.`;
      return `Snapshot of the ${gs.length} group${gs.length>1?'s':''} you supervise:<ul>${gs.map(g=>{
        const ts=tasksOf(g.id), b=ts.filter(t=>t.status==='blocked').length, o=ts.filter(t=>t.status!=='done'&&t.due<now()).length;
        return `<li><b>${esc(g.name)}</b> — ${pctOf(ts)}% done${b?`, ${b} blocked`:''}${o?`, ${o} overdue`:''}${!b&&!o?', on track':''}</li>`;
      }).join('')}</ul>`;
    }
    const g=group(App.me.groupId); if(!g) return `You're not part of a group yet.`;
    const ts=tasksOf(g.id), mine=tasksFor(App.me.id);
    const brk=STATUSES.map(s=>`${ts.filter(t=>t.status===s.id).length} ${s.n.toLowerCase()}`).join(', ');
    return `<b>${esc(g.name)}</b> — ${esc(g.project)} is <b>${pctOf(ts)}%</b> complete.<br>Breakdown: ${brk}.<br>Your share: ${mine.filter(t=>t.status==='done').length}/${mine.length} tasks done (${pctOf(mine)}%).`;
  },

  aHelp(unknown){
    return `${unknown?`I wasn't sure what you meant, but `:''}I can analyse your live workspace. Try asking me to:<ul>
      <li>Show what <b>needs attention</b></li>
      <li><b>Predict deadline risks</b></li>
      <li>Check <b>who is overloaded</b></li>
      <li>Suggest <b>what to focus on next</b></li>
      <li>Give a <b>project summary</b></li></ul>`;
  },

  auditModal(){
    const g = group(App.me.groupId) || (myGroups()[0] || null);
    if (!g) return toast(I.alert(15), 'No group selected to audit');
    const tasks = tasksOf(g.id);
    const ms = membersOf(g.id);

    const overdue = tasks.filter(t => t.status !== 'done' && t.due < now());
    const blocked = tasks.filter(t => t.status === 'blocked');
    const done = tasks.filter(t => t.status === 'done');
    const pct = tasks.length ? Math.round((done.length / tasks.length) * 100) : 0;

    let auditGrade = 'A+';
    let auditColor = 'var(--green)';
    if (overdue.length > 2 || blocked.length > 1) { auditGrade = 'B'; auditColor = 'var(--amber)'; }
    if (overdue.length > 4 || blocked.length > 3) { auditGrade = 'C'; auditColor = 'var(--red)'; }

    const recommendations = [];
    if (blocked.length) recommendations.push(`Resolve ${blocked.length} blocked task(s) immediately.`);
    if (overdue.length) recommendations.push(`${overdue.length} task(s) are overdue. Reassign or extend deadline.`);
    if (ms.length < 4) recommendations.push(`Team has only ${ms.length} members. Add Developer, Tester, and QnA.`);
    if (!recommendations.length) recommendations.push('Workload is balanced and tasks are on track!');

    Modal.open(`
      <div class="mh">

            <div style="font-size:12px; color:var(--muted); margin-top:2px">Blocked: <b style="color:var(--amber)">${blocked.length}</b></div>

    if (impBtn) {
      impBtn.setAttribute('onclick', `AI.importPlannerTasks('${code}')`);
    }

  importPlannerTasks(subjCode) {
    const g = group(App.me.groupId);
    if (!g) return;
    
    const sem = g.semester || 3;
    const courses = CURRICULUM[sem] || CURRICULUM[3];

    const suggestions = AI.templates[subjCode] || AI.defaultTasks;
    let addedCount = 0;

    suggestions.forEach((t, idx) => {
      const chk = document.getElementById(`ai_chk_${idx}`);
      if (chk && chk.checked) {
        const taskId = 't-' + uid();
        DB.s.tasks.push({
          id: taskId,
          groupId: g.id,
          title: t.title,
          desc: t.desc,
          status: 'todo',
          prio: t.prio,
          progress: 0,
          topic: t.topic,
          courseCode: subjCode,
          assigneeId: null,
          creatorId: App.me.id,
          due: now() + 7 * 864e5,
          createdAt: now(),
          updatedAt: now()
        });
        addedCount++;
      }
    });

    if (addedCount > 0) {
      log(g.id, `added <b>${addedCount} suggested tasks</b> via AI Sprint Planner`);
      DB.save();
      API.push();
      FX.tap('done');
      Modal.close();
      toast(I.spark(15), `✓ Added ${addedCount} AI-suggested tasks to To-Do column!`);
      App.render();
    } else {
      toast(I.alert(15), "No tasks were selected.");
    }
  }
};

const Notify={
  cur:[],
  readKey(){ return 'orbit.notif.read.'+App.me.id; },
  read(){ try{ return JSON.parse(localStorage.getItem(Notify.readKey()))||[]; }catch(e){ return []; } },
  setRead(a){ localStorage.setItem(Notify.readKey(),JSON.stringify(a.slice(0,400))); },

  build(){
    if(!App.me) return [];
    const out=[];
    if(App.isFaculty){
      const ids=myGroups().map(g=>g.id);
      const ts=DB.s.tasks.filter(t=>ids.includes(t.groupId));
      ts.filter(t=>t.status==='blocked').forEach(t=>out.push({id:'bl-'+t.id,icon:I.alert,c:'red',ts:t.updatedAt,
        title:`<b>${esc(t.title)}</b> is blocked`,sub:esc(group(t.groupId).name)+' · needs attention',group:t.groupId}));
      ts.filter(t=>t.status!=='done'&&t.due<now()).forEach(t=>out.push({id:'ov-'+t.id,icon:I.clock,c:'amber',ts:t.due,
        title:`<b>${esc(t.title)}</b> is overdue`,sub:esc(group(t.groupId).name)+' · '+dueOf(t.due).t,group:t.groupId}));
      DB.s.activity.filter(a=>ids.includes(a.groupId)&&now()-a.ts<48*36e5).slice(0,10).forEach(a=>{
        const u=user(a.userId);
        out.push({id:'ac-'+a.id,icon:I.activity,c:'blue',ts:a.ts,
          title:`<b>${u?esc(u.name):'Someone'}</b> ${a.text}`,sub:esc((group(a.groupId)||{}).name||'')+' · '+ago(a.ts),group:a.groupId});
      });
    }else{
      const mine=tasksFor(App.me.id), gid=App.me.groupId;
      mine.filter(t=>t.status!=='done'&&t.due<now()).forEach(t=>out.push({id:'ov-'+t.id,icon:I.alert,c:'red',ts:t.due,
        title:`<b>${esc(t.title)}</b> is overdue`,sub:dueOf(t.due).t,task:t.id}));
      mine.filter(t=>t.status!=='done'&&t.due>=now()&&t.due-now()<2*864e5).forEach(t=>out.push({id:'ds-'+t.id,icon:I.clock,c:'amber',ts:t.due,
        title:`<b>${esc(t.title)}</b> is ${dueOf(t.due).t.toLowerCase()}`,sub:'Assigned to you',task:t.id}));
      mine.filter(t=>t.status==='blocked').forEach(t=>out.push({id:'bk-'+t.id,icon:I.alert,c:'red',ts:t.updatedAt,
        title:`<b>${esc(t.title)}</b> is marked blocked`,sub:'Raise it in stand-up',task:t.id}));
      mine.forEach(t=>{ const c=t.comments.filter(x=>x.userId!==App.me.id);
        if(c.length){ const last=c[c.length-1], cu=user(last.userId);
          out.push({id:'cm-'+t.id+'-'+last.ts,icon:I.msg,c:'blue',ts:last.ts,
            title:`<b>${cu?esc(cu.name):'Someone'}</b> commented on <b>${esc(t.title)}</b>`,sub:ago(last.ts),task:t.id}); }});
      (DB.s.notifs || []).filter(nt => nt.userId === App.me.id).forEach(nt => out.push({
        id: nt.id,
        icon: I.pin,
        c: 'accent',
        ts: nt.ts,
        title: `<b>${esc(nt.title)}</b>`,
        sub: `${esc(nt.body)} · ${ago(nt.ts)}`,
        remarkObj: nt.remarkObj || { memberName: App.me.name, memberRole: App.me.role, text: nt.body, by: 'Faculty', ts: nt.ts }
      }));

      DB.s.remarks.filter(r=>r.groupId===gid && (!r.memberId || r.memberId==='all' || r.memberId===App.me.id)).forEach(r=>out.push({
        id:'rm-'+r.id,
        icon:I.pin,
        c:'accent',
        ts:r.ts,
        title:`Faculty remark from <b>${esc(r.by)}</b>${r.memberName && r.memberId!=='all' ? ` for <b>${esc(r.memberName)}</b>` : ''}`,
        sub:ago(r.ts)+' · tap to view',
        remarkObj: r
      }));
    }
    return out.sort((a,b)=>b.ts-a.ts).slice(0,30);
  },

  paint(){
    const b=document.getElementById('bellBtn'); if(!b||!App.me) return;
    Notify.cur=Notify.build();
    const r=Notify.read(), un=Notify.cur.filter(n=>!r.includes(n.id)).length;
    b.innerHTML=I.bell(16);
    const wrap=b.parentElement; if(!wrap) return;
    let bad=wrap.querySelector('.badge');
    if(un){ if(!bad){ bad=document.createElement('span'); bad.className='badge'; wrap.appendChild(bad); } bad.textContent=un>9?'9+':un; }
    else if(bad) bad.remove();
    const p=document.getElementById('notifPanel'); if(p) Notify.fill(p);
  },

  fill(p){
    const r=Notify.read();
    p.innerHTML=`<div class="nh">${I.bell(15)}<h4>Notifications</h4>
      <button class="btn sm gho" onclick="Notify.markAll()">Mark all read</button></div>
      <div class="nl">${Notify.cur.length?Notify.cur.map(n=>`
        <div class="ni ${r.includes(n.id)?'':'un'}" onclick="Notify.open('${n.id}')">
          <div class="nic" style="background:${S_(n.c)};color:${V_(n.c)}">${n.icon(15)}</div>
          <div style="flex:1;min-width:0"><div class="ntx">${n.title}</div><div class="nts">${n.sub}</div></div>
          ${r.includes(n.id)?'':'<span class="undot"></span>'}
        </div>`).join(''):`<div class="empty" style="padding:30px 16px">${I.check(24)}<div class="h">You're all caught up</div><p>No new notifications.</p></div>`}</div>`;
  },

  toggle(){
    const ex=document.getElementById('notifPanel'); if(ex){ ex.remove(); return; }
    FX.tap('med'); Notify.cur=Notify.build();
    const wrap=document.querySelector('.bellwrap'); if(!wrap) return;
    const p=document.createElement('div'); p.id='notifPanel'; p.className='notif';
    p.onclick=e=>e.stopPropagation();
    Notify.fill(p); wrap.appendChild(p);
  },

  open(id){
    const n=Notify.cur.find(x=>x.id===id), r=Notify.read();
    if(!r.includes(id)){ r.unshift(id); Notify.setRead(r); }
    const p=document.getElementById('notifPanel'); if(p) p.remove();
    Notify.paint(); FX.tap('med');
    if(!n) return;
    if(n.task) Modal.task(n.task);
    else if(n.group) App.openG(n.group);
    else if(n.remarkObj) Modal.viewRemarkModal(n.remarkObj);
    else if(n.tab) App.go(n.tab);
  },

  markAll(){
    const r=Notify.read(); Notify.cur.forEach(n=>{ if(!r.includes(n.id)) r.unshift(n.id); });
    Notify.setRead(r); FX.tap('med');
    const p=document.getElementById('notifPanel'); if(p) p.remove();
    Notify.paint(); toast(I.check(15),'All notifications marked read');
  }
};

  toCSV(gid) {
    const targetGid = gid || (App.me && App.me.groupId);
    const g = group(targetGid);
    if (!g) {
      toast(I.alert(15), 'No group selected to export');
      return;
    }
    const tasks = tasksOf(g.id);
    if (!tasks.length) {
      toast(I.alert(15), 'No tasks to export in this group');
      return;
    }

    const headers = ['Task Title', 'Description', 'Subject Code', 'Assignee', 'Role', 'Status', 'Priority', 'Progress %', 'Due Date'];
    const rows = tasks.map(t => {
      const u = user(t.assigneeId);
      const s = stat(t.status);
      const p = prio(t.prio);
      const d = dueOf(t.due);
      return [
        `"${(t.title || '').replace(/"/g, '""').replace(/\r?\n/g, ' ')}"`,
        `"${(t.desc || '').replace(/"/g, '""').replace(/\r?\n/g, ' ')}"`,
        `"${t.courseCode || ''}"`,
        `"${u ? u.name : 'Unassigned'}"`,
        `"${u ? u.role : ''}"`,
        `"${s ? s.n : t.status}"`,
        `"${p ? p.n : t.prio}"`,
        `"${t.progress || 0}%"`,
        `"${d ? d.t : ''}"`
      ];
    });

    const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.setAttribute('href', url);
    link.setAttribute('download', `ProTrack_Report_${(g.name || 'Group').replace(/\s+/g, '_')}_${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    FX.tap('done');
    toast(I.check(15), `Exported ${tasks.length} tasks to CSV spreadsheet!`);
  }
};

    return { member: m, total: mt.length, doneCount: done.length, blockedCount: blocked.length, pct };

/* ============================================================
   PHOTO — profile selfie (picked, resized on a canvas, stored as
   a small data URL in the user's profile). Client-side only.
   ============================================================ */
const Photo={
  _stream: null,
  choose(uid){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=()=>{
      const f=inp.files&&inp.files[0]; if(!f) return;
      if(!/^image\//.test(f.type)){ FX.tap('error'); return toast(I.alert(15),'Please choose an image file'); }
      if(f.size>12e6){ FX.tap('error'); return toast(I.alert(15),'Image too large (max 12 MB)'); }
      const r=new FileReader();
      r.onload=()=>Photo.resize(r.result,data=>{
        const u=user(uid); if(!u) return;
        u.photo=data; DB.save(); FX.tap('done'); App.render();
        toast(I.check(15),'Selfie added'); if(App.me&&App.me.id===uid) Modal.account();
      });
      r.readAsDataURL(f);
    };
    inp.click();
  },
  /* downscale to ~256px and re-encode as JPEG so localStorage stays small */
  resize(src,cb){
    const img=new Image();
    img.onload=()=>{
      const max=256; let w=img.width,h=img.height; const s=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      try{ cb(c.toDataURL('image/jpeg',0.82)); }catch(e){ cb(src); }
    };
    img.onerror=()=>{ FX.tap('error'); toast(I.alert(15),'Could not read that image'); };
    img.src=src;
  },
  remove(uid){ const u=user(uid); if(!u) return; delete u.photo; DB.save(); FX.tap('med'); App.render();
    toast(I.trash(15),'Photo removed'); if(App.me&&App.me.id===uid) Modal.account(); },

  async startWebcam(){
    const area = document.getElementById('selfie_webcam_area');
    const controls = document.getElementById('photo_control_buttons');
    if (!area) return;
    area.style.display = 'flex';
    if (controls) controls.style.display = 'none';

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 320 }, height: { ideal: 320 }, facingMode: 'user' }
      });
      Photo._stream = stream;
      const video = document.getElementById('selfie_video');
      if (video) {
        video.srcObject = stream;
        video.onloadedmetadata = () => video.play();
      }
    } catch(e) {
      toast(I.alert(15), 'Could not access webcam: ' + e.message);
      Photo.stopWebcam();
    }
  },
  stopWebcam(){
    if (Photo._stream) {
      Photo._stream.getTracks().forEach(track => track.stop());
      Photo._stream = null;
    }
    Modal.account('profile');
  },
  captureLiveSelfie(){
    const video = document.getElementById('selfie_video');
    if (!video) return;
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    
    // Mirror drawing for a natural-feeling selfie
    ctx.translate(256, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, 256, 256);
    
    const data = canvas.toDataURL('image/jpeg', 0.85);
    const u = user(App.me.id);
    if (u) {
      u.photo = data;
      DB.save();
      FX.tap('done');
      toast(I.check(15), 'Selfie captured successfully!');
    }
    Photo.stopWebcam();
  },

  _settingsStream: null,
  chooseSettings(){
    Photo.choose(App.me.id);
  },
  removeSettings(){
    Photo.remove(App.me.id);
  },
  async startSettingsWebcam(){
    const area = document.getElementById('set_webcam_area');
    const controls = document.getElementById('set_photo_controls');
    if (!area) return;
    area.style.display = 'flex';
    if (controls) controls.style.display = 'none';

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 320 }, height: { ideal: 320 }, facingMode: 'user' }
      });
      Photo._settingsStream = stream;
      const video = document.getElementById('set_selfie_video');
      if (video) {
        video.srcObject = stream;
        video.onloadedmetadata = () => video.play();
      }
    } catch(e) {
      toast(I.alert(15), 'Could not access webcam: ' + e.message);
      Photo.stopSettingsWebcam();
    }
  },
  stopSettingsWebcam(){
    if (Photo._settingsStream) {
      Photo._settingsStream.getTracks().forEach(track => track.stop());
      Photo._settingsStream = null;
    }
    const area = document.getElementById('set_webcam_area');
    const controls = document.getElementById('set_photo_controls');
    if (area) area.style.display = 'none';
    if (controls) controls.style.display = 'flex';
  },
  captureSettingsSelfie(){
    const video = document.getElementById('set_selfie_video');
    if (!video) return;
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    
    ctx.translate(256, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, 256, 256);
    
    const data = canvas.toDataURL('image/jpeg', 0.85);
    const u = user(App.me.id);
    if (u) {
      u.photo = data;
      App.me.photo = data;
      DB.save();
      API.push();
      FX.tap('done');
      toast(I.check(15), 'Selfie captured successfully!');
      App.render();
    }
    Photo.stopSettingsWebcam();
  }
};

  calcTotalGrade() {
    const lit = Math.max(0, Math.min(10, parseInt(document.getElementById('grade_lit').value || 0, 10)));
    const des = Math.max(0, Math.min(20, parseInt(document.getElementById('grade_design').value || 0, 10)));
    const qual = Math.max(0, Math.min(40, parseInt(document.getElementById('grade_quality').value || 0, 10)));
    const pres = Math.max(0, Math.min(30, parseInt(document.getElementById('grade_presentation').value || 0, 10)));
    
    const total = lit + des + qual + pres;
    document.getElementById('grade_total_display').innerText = total;
    
    let grade = 'F';
    if (total >= 90) grade = 'A+';
    else if (total >= 80) grade = 'A';
    else if (total >= 70) grade = 'B';
    else if (total >= 55) grade = 'C';
    else if (total >= 40) grade = 'D';
    
    document.getElementById('grade_badge_display').innerText = 'Grade: ' + grade;
  },

  submitGroupEvaluation(gid){
    const lit = Math.max(0, Math.min(10, parseInt(document.getElementById('grade_lit').value || 0, 10)));
    const des = Math.max(0, Math.min(20, parseInt(document.getElementById('grade_design').value || 0, 10)));
    const qual = Math.max(0, Math.min(40, parseInt(document.getElementById('grade_quality').value || 0, 10)));
    const pres = Math.max(0, Math.min(30, parseInt(document.getElementById('grade_presentation').value || 0, 10)));
    const comments = document.getElementById('grade_comments').value.trim();
    
    if(!comments) return Modal.err('grade_err', 'Please write some evaluation feedback comments.');

    DB.s.grades = DB.s.grades || [];
    const idx = DB.s.grades.findIndex(gr => gr.groupId === gid);
    
    const total = lit + des + qual + pres;
    let grade = 'F';
    if (total >= 90) grade = 'A+';
    else if (total >= 80) grade = 'A';
    else if (total >= 70) grade = 'B';
    else if (total >= 55) grade = 'C';
    else if (total >= 40) grade = 'D';

    const scoreData = {
      id: 'gr-' + uid().slice(0, 8),
      groupId: gid,
      gradedById: App.me.id,
      gradedByName: App.me.name,
      rubrics: { literature: lit, design: des, quality: qual, presentation: pres },
      total,
      grade,
      comments,
      updatedAt: now()

    if (idx !== -1) {
      DB.s.grades[idx] = scoreData;
    } else {
      DB.s.grades.push(scoreData);
    }

    log(gid, `graded group project with total score: <b>${total} (${grade})</b>`);
    DB.save();
    API.push();
    FX.tap('done');

    toast(I.check(15), "Group evaluated successfully!");

  async doSendSupervisionRequest(){
    const inputEl = document.getElementById('req_group_input');
    if (!inputEl) return;
    const q = inputEl.value.trim();
    if (!q) return Modal.err('req_err', 'Please enter a group number or Team Lead name.');

    const btn = document.getElementById('req_send_btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }

    // Always fetch latest state first to ensure we match against fresh backend data
    try {
      const res = await fetch(API_URL + '/api/sync');
      if (res.ok) {
        const data = await res.json();
        if (data && data.users) {
          DB.s = data;
          localStorage.setItem(K_STATE, JSON.stringify(DB.s));
        }
      }
    } catch(e) {}

    const cleanStr = s => s.toLowerCase().replace(/^group\s*/i, '').trim();
    const targetQ = cleanStr(q);

    // 1. Try to find group by group name or group ID matching
    let matchedGroup = DB.s.groups.find(g => {
      const gNameClean = cleanStr(g.name);
      return (
        g.name.toLowerCase() === q.toLowerCase() ||
        g.id.toLowerCase() === q.toLowerCase() ||
        gNameClean === targetQ ||
        ('0' + gNameClean) === targetQ ||
        gNameClean === ('0' + targetQ)
      );
    });

    // 2. If not matched, try to find by Team Lead's name
    if (!matchedGroup) {
      const matchedLead = DB.s.users.find(u => 
        u.role === 'Team Lead' && 
        (u.name.toLowerCase() === q.toLowerCase() || 
         u.name.toLowerCase().includes(q.toLowerCase()))
      );
      if (matchedLead && matchedLead.groupId) {
        matchedGroup = DB.s.groups.find(g => g.id === matchedLead.groupId);
      }
    }

    if (!matchedGroup) {
      if (btn) { btn.disabled = false; btn.innerHTML = `${I.mail(14)} Send Request`; }
      return Modal.err('req_err', `No group or Team Lead matches '${q}'. Try '03' or 'yugal'.`);
    }

    const groupId = matchedGroup.id;
    const facSubj = document.getElementById('req_subject_select')?.value || App.me.subjectCode || '23AID205';

    // Check if already pending locally/in DB
    DB.s.invites = DB.s.invites || [];
    const alreadyLocal = DB.s.invites.find(i => i.groupId === groupId && i.facultyId === App.me.id && i.subjectCode === facSubj && i.status === 'pending');
    if (alreadyLocal) {
      if (btn) { btn.disabled = false; btn.innerHTML = `${I.mail(14)} Send Request`; }
      return Modal.err('req_err', `You already have a pending request for ${matchedGroup.name} under ${facSubj}.`);
    }

    let sent = false;

    // Try backend direct invite
    try {
      const res = await fetch(API_URL + '/api/invites/direct', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          groupId,
          facultyId: App.me.id,
          facultyName: App.me.name,
          facultyEmail: App.me.email,
          subjectCode: facSubj
        })
      });
      const data = await res.json();
      if (!res.ok) {
        if (btn) { btn.disabled = false; btn.innerHTML = `${I.mail(14)} Send Request`; }
        return Modal.err('req_err', data.error || 'Failed to send request.');
      }
      sent = true;
      await API.check();
    } catch(e) {}

    if (!sent) {
      // Offline fallback
      const inv = {
        id: 'inv-' + uid().slice(0, 8),
        groupId: matchedGroup.id, groupName: matchedGroup.name,
        facultyId: App.me.id, facultyName: App.me.name, facultyEmail: App.me.email,
        subjectCode: facSubj, status: 'pending', ts: now()
      };
      DB.s.invites.unshift(inv);
      log(matchedGroup.id, `sent a supervision request for subject <b>${esc(facSubj)}</b>`);
      DB.save();
    }

    FX.tap('done');

  onFileDropped(e){
    const dt = e.dataTransfer;

    if(files && files.length){
      document.getElementById('deliv_file_input').files = files;
      Modal.onFileSelected(document.getElementById('deliv_file_input'));
    }
  },

  onFileSelected(input){
    const file = input.files && input.files[0];
    if(!file) return;
    const titleIn = document.getElementById('deliv_title');
    const typeIn = document.getElementById('deliv_type');
    const dropContent = document.getElementById('dropzone_content');

    if(titleIn && !titleIn.value.trim()){
      titleIn.value = file.name;
    }

    const nameLower = file.name.toLowerCase();
    let ext = 'FILE';
    if(nameLower.endsWith('.pdf')) { ext = 'PDF'; if(typeIn) typeIn.value = 'report'; }
    else if(nameLower.endsWith('.doc') || nameLower.endsWith('.docx')) { ext = 'DOC'; if(typeIn) typeIn.value = 'report'; }
    else if(nameLower.endsWith('.ppt') || nameLower.endsWith('.pptx')) { ext = 'PPT'; if(typeIn) typeIn.value = 'ppt'; }
    else if(nameLower.endsWith('.zip') || nameLower.endsWith('.rar')) { ext = 'ZIP'; if(typeIn) typeIn.value = 'code'; }
    else if(nameLower.endsWith('.py') || nameLower.endsWith('.ipynb')) { ext = 'CODE'; if(typeIn) typeIn.value = 'code'; }

    const sz = file.size >= 1048576 ? (file.size / 1048576).toFixed(2) + ' MB' : (file.size / 1024).toFixed(1) + ' KB';

    if(dropContent){
      dropContent.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px; text-align:left; background:var(--surface); padding:12px 14px; border-radius:var(--r2); border:1px solid var(--accent-line);">
          <div style="width:40px; height:40px; border-radius:var(--r); background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; flex:none;">
            ${ext}
          </div>
          <div style="flex:1; min-width:0">
            <div style="font-weight:700; font-size:13.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(file.name)}</div>
            <div style="font-size:11.5px; color:var(--green); font-weight:600; margin-top:2px">Size: ${sz} · File selected &amp; ready</div>
          </div>
          <button type="button" class="btn sm gho ico" title="Change file" onclick="event.stopPropagation(); Modal.clearUploadedFile();">${I.x(14)}</button>
        </div>
      `;
    }

    const reader = new FileReader();
    reader.onload = (ev) => {
      Modal._uploadedFileData = {
        name: file.name,
        sizeStr: sz,
        dataUrl: ev.target.result
      };
    };
    reader.readAsDataURL(file);
  },

  clearUploadedFile(){
    Modal._uploadedFileData = null;
    const input = document.getElementById('deliv_file_input');
    if(input) input.value = '';
    const dropContent = document.getElementById('dropzone_content');

  doSaveDeliverable(gid){

    if (Modal._uploadedFileData) {
      url = Modal._uploadedFileData.dataUrl;
      if (!title) title = Modal._uploadedFileData.name;
    }

    if (!title) return toast(I.alert(15), 'Please enter a deliverable title or select a file');
    if (!url) return toast(I.alert(15), 'Please select a file or provide a link URL');

    const type = document.getElementById('deliv_type').value;
    const courseCode = document.getElementById('deliv_subj').value || null;
    const desc = document.getElementById('deliv_desc').value.trim();
    const sizeStr = Modal._uploadedFileData ? Modal._uploadedFileData.sizeStr : null;

    g.deliverables = g.deliverables || [];
    g.deliverables.push({
      id: uid(),
      title,
      type,
      courseCode,
      url,
      sizeStr,
      desc,
      isFileUpload: !!Modal._uploadedFileData,
      submittedBy: App.me ? App.me.name : 'Team Lead',
      ts: now()
    });

    Modal._uploadedFileData = null;
    log(gid, `uploaded project deliverable: <b>${esc(title)}</b> (${type.toUpperCase()})`);
